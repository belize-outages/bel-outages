<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belize power outages</title>
<meta name="description" content="Which BEL feeders have a scheduled power outage in Belize, and when. Compiled from BEL's public notices.">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#9889;</text></svg>">
</head>
<body>

<div id="app">

  <main id="mapWrap">
    <svg id="map" role="img" aria-label="Map of Belize showing electricity feeder service areas">
      <g id="layerDistricts"></g>
      <g id="layerPlaces"></g>
      <g id="layerRoads"></g>
      <g id="layerFeeders"></g>
      <g id="layerPoints"></g>
      <g id="layerRoadLabels"></g>
      <g id="layerLabels"></g>
      <g id="layerPin"></g>
    </svg>
  </main>

  <div id="stale" class="banner" hidden>
    <strong>This data may be out of date.</strong>
    <span id="staleWhen"></span>
    <a id="staleLink" href="https://www.bel.com.bz/PowerUpdates/" rel="noopener">Check bel.com.bz</a>
  </div>

  <div class="topbar">
    <div class="searchwrap">
      <svg class="mag" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      <input id="q" type="search" autofocus autocomplete="off" autocapitalize="off"
             spellcheck="false" placeholder="your village, town or street"
             aria-label="Search for your village, town or street"
             role="combobox" aria-expanded="false" aria-controls="results">
      <button id="clear" type="button" aria-label="Clear search" hidden>&times;</button>
    </div>
    <ul id="results" role="listbox" hidden></ul>
  </div>

  <div class="mapctl">
    <button id="zin"  type="button" aria-label="Zoom in">+</button>
    <button id="zout" type="button" aria-label="Zoom out">&minus;</button>
    <button id="zfit" type="button" aria-label="Reset the map">&#9678;</button>
    <button id="legendBtn" type="button" aria-expanded="false" aria-controls="legend" aria-label="Map key">?</button>
  </div>

  <ul class="legend" id="legend" aria-label="Map key" hidden>
    <li><i class="sw off"></i>Off now</li>
    <li><i class="sw today"></i>Off today</li>
    <li><i class="sw soon"></i>Scheduled</li>
    <li><i class="sw none"></i>Nothing listed</li>
  </ul>

  <section id="sheet" class="sheet" aria-label="Outage details">
    <button id="grab" class="grab" type="button" aria-label="Expand or collapse the panel"><span></span></button>
    <div id="sheetBody" class="sheetbody" aria-live="polite"></div>
    <p class="disclaim">
      <strong>Not affiliated with Belize Electricity Limited.</strong>
      Verify with the BEL 24-7 app.
      <button id="aboutBtn" class="linky" type="button" aria-expanded="false">About</button>
    </p>
  </section>

</div>

<script src="vendor/fuse.min.js"></script>
<script src="data/bundle.js"></script>
<script src="app.js"></script>
</body>
</html>
